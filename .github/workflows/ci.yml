# Continuous integration — every gate of docs/arquitetura.md §8, on every PR and on main.
#
# quality ─┐
# wasm ────┴─ build ── e2e
#
# Supply chain: every action is pinned to a full commit SHA (tag in the trailing
# comment; Dependabot keeps both in sync). Pins verified with `git ls-remote`
# (see docs/research/github-actions.md and ADR 0005). Releases younger than 14
# days were avoided where an older release exists (same cooldown as Dependabot).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One deployment target for build, link check and e2e (the project site; ADR 0005).
  # astro.config.ts, scripts/lib/site.ts and playwright.config.ts all read these.
  SITE: https://flaviotinococoutinho.github.io
  BASE_PATH: /flaviotinoco.github.io
  FORCE_COLOR: '1'

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality (tokens, palette, types, lint, format, i18n, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `version` input: the action reads "packageManager" from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Design tokens are up to date (tokens.json → tokens.css)
        run: pnpm check:tokens
      - name: Palette (WCAG AAA, APCA, gamut, CIEDE2000 under CVD)
        run: pnpm verify:palette
      - name: Types (astro check + tsc)
        run: pnpm check:types
      - name: Lint (core purity, layering, typescript-eslint)
        run: pnpm check:lint
      - name: Formatting
        run: pnpm check:format
      - name: Bilingual parity (catalogs, translations, strata)
        run: pnpm check:i18n
      - name: Unit and property tests (coverage gate)
        run: pnpm test --coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  wasm:
    name: WebAssembly kernels (fmt, clippy, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Single source of truth for the toolchain: wasm/rust-toolchain.toml.
      - name: Read the pinned Rust toolchain
        id: rust
        run: |
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' wasm/rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "::error file=wasm/rust-toolchain.toml::no [toolchain] channel found"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # Pinned to master (not the `stable` branch, which is outside master's history).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-08)
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'wasm -> target'
          # Shared with deploy.yml (the default key includes the job id). Only main writes it.
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: cargo fmt, clippy (host and wasm32), tests
        run: pnpm check:wasm
      - name: Build, validate and size-check the kernels
        run: node scripts/build-wasm.mjs
      - run: pnpm install --frozen-lockfile
      - name: Kernel tests through the TypeScript wrappers (vitest project "wasm")
        run: pnpm test:wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm
          path: |
            src/wasm/*.wasm
            src/wasm/manifest.json
          retention-days: 7
          if-no-files-found: error

  build:
    name: Site (build, search index, links, budgets)
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm
          path: src/wasm/
      # `pnpm build` would rebuild the kernels (it starts with build:wasm); reuse the artifact instead.
      # build:site fails on [ERROR] lines: Astro only logs Markdown render failures and exits 0.
      - name: Build the site and the Pagefind index
        run: pnpm build:site && pnpm search:index
      - name: Internal links and fragments
        run: pnpm check:links
      - name: Size budgets
        run: pnpm check:budgets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: End-to-end (axe in light and dark, keyboard, motion)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist/
      # Playwright's CI guide advises against caching browsers; --only-shell fetches the headless shell only.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # playwright.config.ts starts `astro preview` on dist/ with the same BASE_PATH.
      - name: Run Playwright
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
