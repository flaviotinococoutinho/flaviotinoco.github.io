# WebAssembly kernels for the interactive labs (see docs/adr/0003-wasm-kernels.md).
#
# Build (from the repository root): `node scripts/build-wasm.mjs`
# Host checks (from this directory):
#   cargo fmt --check
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
#   cargo test --workspace

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/signal",
    "crates/information",
    "crates/dynamics",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
kernel-core = { path = "crates/core" }
# Pure-Rust libm: the only external dependency allowed in the kernels (no std on wasm32).
libm = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
float_cmp = "allow"

[profile.release]
# opt-level was chosen by measuring 3 / "s" / "z" on all three modules (ADR 0003).
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
# The cdylibs are `no_std`; abort keeps host `cargo check`/`clippy` builds free of
# the `eh_personality` lang item. Test harnesses always use unwinding regardless.
panic = "abort"
